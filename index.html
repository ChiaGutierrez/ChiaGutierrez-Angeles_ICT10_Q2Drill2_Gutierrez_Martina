
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Members</title>

    
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.3/core.js"></script>

    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        input {
            width: 98%;
            padding: 8px;
            margin-bottom: 10px;
            background-color: rgb(255, 169, 201);
            border: 1px solid #ff6bab;
            border-radius: 5px;
        }

        button {
            background-color: #ff70ae;
            color: rgb(0, 0, 0);
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
        }

        #results {
            margin-top: 18px;
            background-color: #ff98c4;
            padding: 12px;
            color: rgb(2, 2, 2);
        }
    </style>
</head>

<body>

    <h2>Add Club Member:</h2>

    <input type="text" id="first_name" placeholder="First Name">
    <input type="text" id="last_name" placeholder="Last Name">

    <button id="add_member">Submit</button>

    <div id="results"></div>

    <!-- Connect Python file -->
    <script type="py" src="./main.py"></script>
